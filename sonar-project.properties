# PenguinTools is analyzed by its own .NET workflow and Sonar project.
sonar.sources=.
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=external/**,node_modules/**,dist/**,src-tauri/target/**,src-tauri/resources/**,src-tauri/gen/**,src/locales/messages.*.json,src/**/*.test.ts,src/**/*.test.tsx
# Coverage is deliberately outside this project's quality gate.
sonar.coverage.exclusions=**
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
